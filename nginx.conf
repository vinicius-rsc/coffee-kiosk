server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length 256;

    # Headers de segurança básicos.
    # CSP fica de fora de propósito: o kiosk carrega fontes/ícones de CDN
    # (Google Fonts, jsdelivr/tabler) e fala com o Apps Script. Um CSP
    # mal calibrado quebraria a página. Se quiser endurecer depois, libere
    # fonts.googleapis.com, fonts.gstatic.com, cdn.jsdelivr.net e
    # script.google.com explicitamente.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Endpoint de healthcheck (usado pelo HEALTHCHECK do container e pelo Komodo)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML nunca é cacheado — assim, ao redeployar, o tablet/recepção
    # pega a versão nova sem precisar limpar cache.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
