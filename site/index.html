<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Kiosk</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f3; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f5f5f3; }
      a { background: #262626 !important; color: #f5f5f3 !important; border-color: #333 !important; }
    }
    h1 { font-weight: 600; letter-spacing: -0.5px; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    a {
      text-decoration: none; padding: 18px 28px; border-radius: 14px;
      background: #fff; color: #1a1a1a; border: 1px solid #e5e5e5;
      font-size: 18px; font-weight: 600; transition: transform .15s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <h1>☕ Coffee Kiosk</h1>
  <div class="links">
    <a href="/kiosk.html">Kitchen tablet</a>
    <a href="/dashboard.html">Reception dashboard</a>
  </div>
</body>
</html>
