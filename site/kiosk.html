<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coffee kiosk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">

<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f3;
  --bg-tertiary: #ebebe8;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #999;
  --border: #e5e5e5;
  --border-strong: #ccc;
  --bg-success: #d1fadf;
  --border-success: #6ee7a8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1a1a1a;
    --bg-secondary: #262626;
    --bg-tertiary: #333;
    --text-primary: #f5f5f3;
    --text-secondary: #a0a0a0;
    --text-tertiary: #707070;
    --border: #333;
    --border-strong: #555;
    --bg-success: #14532d;
    --border-success: #16a34a;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow: visible;
}

.kiosk {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 24px 32px;
  position: relative;
  min-height: 100vh;
}

.kiosk-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 32px;
  gap: 16px;
}
.kiosk-title {
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.8px;
  display: flex;
  align-items: center;
  gap: 14px;
  line-height: 1.05;
}
.kiosk-title i {
  color: var(--text-secondary);
  font-size: 30px;
}
.kiosk-sub {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 10px;
  margin-left: 44px;
}
.kiosk-clock-block { text-align: right; flex-shrink: 0; }
.kiosk-clock {
  font-size: 54px;
  font-weight: 600;
  letter-spacing: -2.6px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.kiosk-clock .colon {
  display: inline-block;
  margin: 0 -2px;
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.kiosk-date {
  font-size: 17px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: -0.2px;
  margin-top: 10px;
}

.kiosk-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.daily-message {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  /* Fallback for Chrome <111 (tablet) — color-mix below overrides where supported */
  background: var(--bg-secondary);
  border: 0.5px solid var(--border);
  background: color-mix(in srgb, #BA7517 9%, var(--bg-secondary));
  border: 0.5px solid color-mix(in srgb, #BA7517 25%, transparent);
  border-radius: 999px;
  padding: 14px 28px;
  flex: 0 1 460px;
  align-self: center;
  margin: 0 12px;
  min-width: 0;
  font-size: 19px;
  color: var(--text-secondary);
  font-style: italic;
  letter-spacing: -0.2px;
  text-align: center;
  animation: fadeInMessage 0.6s ease-out;
}
.daily-message i {
  font-style: normal;
  color: #BA7517;
  font-size: 22px;
  flex-shrink: 0;
}
@keyframes fadeInMessage {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.kiosk-card {
  position: relative;
  border: 0.5px solid var(--border);
  border-radius: 18px;
  padding: 22px 22px 22px 34px;
  cursor: pointer;
  /* Fallback for Chrome <111 */
  background: var(--bg-secondary);
  background:
    radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--card-color) 18%, transparent), transparent 65%),
    color-mix(in srgb, var(--card-color) 4%, var(--bg-secondary));
  transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1),
              background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  text-align: left;
  font-family: inherit;
  overflow: hidden;
  min-height: 96px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.kiosk-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 7px;
  background: var(--card-color);
  border-radius: 18px 0 0 18px;
  transition: width 0.2s ease;
}
.kiosk-card:hover {
  /* Fallbacks for Chrome <111 */
  background: var(--bg-tertiary);
  border-color: var(--card-color);
  box-shadow: 0 8px 22px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.05);
  background:
    radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--card-color) 26%, transparent), transparent 70%),
    color-mix(in srgb, var(--card-color) 8%, var(--bg-secondary));
  border-color: color-mix(in srgb, var(--card-color) 50%, var(--border));
  transform: translateY(-2px);
  box-shadow: 0 8px 22px color-mix(in srgb, var(--card-color) 18%, transparent),
              0 1px 2px rgba(0,0,0,0.05);
}
.kiosk-card:hover::before { width: 10px; }
.kiosk-card:active { transform: translateY(0) scale(0.98); }
.kiosk-card-name {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.4px;
  color: var(--text-primary);
  transition: color 0.2s ease;
}
.kiosk-card.tapped {
  background: var(--card-color);
  border-color: var(--card-color);
  transform: scale(0.97);
  /* Fallback for Chrome <111 */
  box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  box-shadow: 0 8px 28px color-mix(in srgb, var(--card-color) 40%, transparent);
}
.kiosk-card.tapped::before {
  width: 7px;
  background: rgba(255, 255, 255, 0.5);
}
.kiosk-card.tapped .kiosk-card-name { color: #ffffff; }
.kiosk-card-check {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-size: 17px;
}
.kiosk-card.tapped .kiosk-card-check { opacity: 1; transform: scale(1); }

.plus-one {
  position: absolute;
  font-family: 'Inter', sans-serif;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -2px;
  pointer-events: none;
  z-index: 25;
  transform: translate(-50%, -50%) scale(0.4);
  opacity: 0;
  animation: plusOneFloat 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  user-select: none;
  font-feature-settings: 'tnum' 1;
  line-height: 1;
}
@keyframes plusOneFloat {
  0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
  8% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  16% { transform: translate(-50%, calc(-50% - 6px)) scale(1); opacity: 1; }
  60% { transform: translate(-50%, calc(-50% - 40px)) scale(1); opacity: 1; }
  100% { transform: translate(-50%, calc(-50% - 110px)) scale(0.8); opacity: 0; }
}

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-60px);
  background: var(--text-primary);
  color: var(--bg-primary);
  padding: 13px 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.1px;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 10000;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #DC2626; color: white; }
.toast i { font-size: 16px; }

.kiosk-footer {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
  min-height: 60px;
}
.undo-btn {
  --undo-color: var(--text-secondary);
  position: relative;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  /* Fallbacks for Chrome <111 */
  background: var(--bg-primary);
  border: 0.5px solid var(--border-strong);
  box-shadow: 0 6px 18px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.04);
  background: color-mix(in srgb, var(--undo-color) 10%, var(--bg-primary));
  border: 0.5px solid color-mix(in srgb, var(--undo-color) 35%, transparent);
  cursor: pointer;
  font-family: inherit;
  padding: 14px 24px 14px 20px;
  border-radius: 999px;
  display: none;
  align-items: center;
  gap: 12px;
  letter-spacing: -0.2px;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--undo-color) 18%, transparent),
              0 1px 2px rgba(0,0,0,0.04);
  transition: background 0.18s, transform 0.16s, box-shadow 0.2s, border-color 0.18s;
  overflow: hidden;
}
.undo-btn.show {
  display: inline-flex;
  animation: undoIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.undo-btn:hover {
  /* Fallbacks for Chrome <111 */
  background: var(--bg-secondary);
  border-color: var(--border-strong);
  background: color-mix(in srgb, var(--undo-color) 18%, var(--bg-primary));
  border-color: color-mix(in srgb, var(--undo-color) 55%, transparent);
  transform: translateY(-2px);
}
.undo-btn:active { transform: translateY(0) scale(0.97); }
.undo-btn .icon-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  /* Fallback for Chrome <111 */
  background: var(--bg-tertiary);
  background: color-mix(in srgb, var(--undo-color) 22%, transparent);
  color: var(--undo-color);
  flex-shrink: 0;
}
.undo-btn .icon-wrap i { font-size: 17px; }
.undo-btn-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.15; }
.undo-btn-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.2px; text-transform: uppercase; }
.undo-btn-target { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.undo-btn-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--undo-color);
  border-radius: 0 0 999px 999px;
  width: 100%;
  transform-origin: left center;
  opacity: 0.4;
}
.undo-btn.show .undo-btn-progress {
  animation: progressDeplete 30s linear forwards;
}
@keyframes undoIn {
  0% { transform: translateY(14px) scale(0.88); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes progressDeplete {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

.kiosk-card-name .guest-icon {
  font-style: normal;
  font-size: 18px;
  color: var(--text-secondary);
  margin-right: 8px;
  vertical-align: -2px;
}

.kiosk-card-row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.kiosk-card-logo {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 10px;
  /* White chip so dark-on-transparent logos stay readable in dark mode */
  background: #ffffff;
  border: 0.5px solid var(--border);
  object-fit: contain;
  padding: 5px;
}

/* ── Portrait / narrow screens (tablet held vertically) ──
   Goal: EVERYTHING fits on one screen, no scrolling.
   The grid splits the remaining height equally between rows,
   so cards shrink automatically when guests are added. */
@media (max-width: 900px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }
  .kiosk {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 16px;
  }

  /* Header: title + clock on line 1, quote full-width on line 2 */
  .kiosk-header {
    flex-wrap: wrap;
    flex-shrink: 0;
    margin-bottom: 14px;
  }
  .kiosk-title { font-size: 28px; }
  .kiosk-clock { font-size: 42px; }
  .daily-message {
    order: 3;
    flex: 1 1 100%;
    max-width: 100%;
    margin: 12px 0 0;
    font-size: 18px;
    padding: 10px 20px;
  }

  /* Grid fills the rest of the screen; rows share the height */
  .kiosk-grid {
    flex: 1;
    min-height: 0;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 10px;
    overflow: hidden;
  }
  .kiosk-card {
    min-height: 0;
    padding: 12px 14px 12px 24px;
    border-radius: 14px;
  }
  .kiosk-card-name { font-size: 21px; letter-spacing: -0.3px; }
  .kiosk-card-row { gap: 10px; }
  .kiosk-card-logo { width: 40px; height: 40px; border-radius: 8px; padding: 4px; }
  .kiosk-card-check { top: 10px; right: 10px; width: 26px; height: 26px; font-size: 14px; }
  .plus-one { font-size: 36px; }

  /* Undo floats fixed at the very top, in front of the header/quote,
     so it's always on screen during the 30s window */
  .kiosk-footer {
    position: fixed;
    top: 12px;
    left: 0;
    right: 0;
    margin: 0;
    min-height: 0;
    justify-content: center;
    z-index: 9000;
    pointer-events: none;
  }
  .undo-btn { pointer-events: auto; }

  /* Toast moves to the bottom so it doesn't cover the undo button */
  .toast {
    top: auto;
    bottom: 24px;
    transform: translateX(-50%) translateY(80px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
}

/* ── PIN pad overlay ── */
.pin-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 11000;
  padding: 20px;
}
.pin-overlay.open { display: flex; }
.pin-panel {
  background: var(--bg-primary);
  border: 0.5px solid var(--border);
  border-radius: 22px;
  padding: 26px 26px 22px;
  width: 340px;
  max-width: 100%;
  text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  animation: pinIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pinIn {
  from { transform: scale(0.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.pin-company {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.4px;
  color: var(--pin-color, var(--text-primary));
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pin-hint {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 18px;
}
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 10px;
}
.pin-dots.shake { animation: pinShake 0.4s ease; }
@keyframes pinShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
.pin-dot {
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: transparent;
  transition: background 0.12s, border-color 0.12s, transform 0.12s;
}
.pin-dot.filled {
  background: var(--pin-color, var(--text-primary));
  border-color: var(--pin-color, var(--text-primary));
  transform: scale(1.12);
}
.pin-error {
  font-size: 13px;
  font-weight: 600;
  color: #DC2626;
  min-height: 18px;
  margin-bottom: 8px;
  visibility: hidden;
}
.pin-error.show { visibility: visible; }
.pin-keys {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.pin-key {
  font-family: inherit;
  font-size: 26px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  height: 64px;
  cursor: pointer;
  transition: background 0.12s, transform 0.1s;
  font-variant-numeric: tabular-nums;
}
.pin-key:active { background: var(--bg-tertiary); transform: scale(0.95); }
.pin-key.fn { font-size: 20px; color: var(--text-secondary); }
.pin-cancel {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 8px 16px;
}
.pin-panel.busy .pin-key, .pin-panel.busy .pin-cancel { pointer-events: none; opacity: 0.5; }
.pin-panel.busy .pin-dots { animation: pinPulse 1s ease-in-out infinite; }
@keyframes pinPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>

<div class="kiosk">
  <h1 class="sr-only">Coffee kiosk. Tap your team to log a coffee.</h1>

  <div class="toast" id="toast">
    <i class="ti ti-check" id="toastIcon"></i>
    <span id="toastText">Logged</span>
  </div>

  <div class="kiosk-header">
    <div>
      <div class="kiosk-title">
        <i class="ti ti-coffee"></i>
        <span>Whose tab?</span>
      </div>
      <div class="kiosk-sub">Tap your team to log this coffee</div>
    </div>
    <div class="daily-message">
      <i class="ti ti-coffee"></i>
      <span id="dailyMessage">…</span>
    </div>
    <div class="kiosk-clock-block">
      <div class="kiosk-clock">
        <span id="hours">--</span><span class="colon">:</span><span id="minutes">--</span>
      </div>
      <div class="kiosk-date" id="dateStr">—</div>
    </div>
  </div>

  <div class="kiosk-grid" id="grid"></div>

  <div class="kiosk-footer">
    <button class="undo-btn" id="undoBtn">
      <div class="icon-wrap"><i class="ti ti-arrow-back-up"></i></div>
      <div class="undo-btn-text">
        <div class="undo-btn-label">Oops! Tap to undo</div>
        <div class="undo-btn-target" id="undoTarget">—</div>
      </div>
      <div class="undo-btn-progress"></div>
    </button>
  </div>

  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-panel" id="pinPanel">
      <div class="pin-company" id="pinCompany">—</div>
      <div class="pin-hint" id="pinHint">Enter your team's 4-digit PIN</div>
      <div class="pin-dots" id="pinDots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <div class="pin-error" id="pinError">Wrong PIN — try again</div>
      <div class="pin-keys">
        <button class="pin-key" data-key="1">1</button>
        <button class="pin-key" data-key="2">2</button>
        <button class="pin-key" data-key="3">3</button>
        <button class="pin-key" data-key="4">4</button>
        <button class="pin-key" data-key="5">5</button>
        <button class="pin-key" data-key="6">6</button>
        <button class="pin-key" data-key="7">7</button>
        <button class="pin-key" data-key="8">8</button>
        <button class="pin-key" data-key="9">9</button>
        <button class="pin-key fn" data-key="clear">C</button>
        <button class="pin-key" data-key="0">0</button>
        <button class="pin-key fn" data-key="back"><i class="ti ti-backspace"></i></button>
      </div>
      <button class="pin-cancel" id="pinCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// EDIT THIS: paste your Apps Script Web App URL here
// ═══════════════════════════════════════════════════════════════
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw_Nleh5HTo-hJvbuvCBzvjoHNF0F3mgZiUP21bzWPPESqNO6U05_YUNe8sxsyFU8jzEg/exec';

// Keep this list IDENTICAL to CONFIG.companies in coffee-kiosk.gs
const companies = [
  { name: '4Technology',           color: '#06B6D4' },
  { name: 'Black Salt Games',      color: '#5F5E5A' },
  { name: 'Brush Technology',      color: '#C084FC' },

const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// 44 daily coffee messages — rotates by day-of-year, same all day for everyone.
// Add or remove freely; the rotation just mods by array length.

function getDailyMessage() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return DAILY_MESSAGES[dayOfYear % DAILY_MESSAGES.length];
}

function renderDailyMessage() {
  const el = document.getElementById('dailyMessage');
  if (el) el.textContent = getDailyMessage();
}

let lastTap = null;  // { company, color, timestamp }

// The live list shown on the grid. Starts from the hardcoded companies
// (so the kiosk works even offline) and is replaced by the backend list,
// which also includes guests, balances and whether a PIN is required.
let parties = companies.map(c => ({
  name: c.name, color: c.color, isGuest: false, balance: 0, requiresPin: true
}));

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function syncParties() {
  if (WEB_APP_URL === 'PASTE_YOUR_WEB_APP_URL_HERE') return;
  try {
    const res = await fetch(WEB_APP_URL);
    const data = await res.json();
    if (data.ok && Array.isArray(data.accounts) && data.accounts.length) {
      const next = data.accounts.map(a => ({
        name: a.name,
        color: a.color,
        isGuest: !!a.isGuest,
        balance: Number(a.balance) || 0,
        requiresPin: !!a.requiresPin
      }));
      // Rebuild only when names/colors change; just refresh balances otherwise
      const sig = list => JSON.stringify(list.map(p => [p.name, p.color, p.isGuest, p.requiresPin]));
      if (sig(next) !== sig(parties)) {
        parties = next;
        buildGrid();
      } else {
        next.forEach((p, i) => { parties[i].balance = p.balance; });
      }
    }
  } catch (err) {
    // Offline or backend unreachable — keep showing the current list
    console.warn('Could not sync company list', err);
  }
}

async function sendToBackend(payload) {
  const res = await fetch(WEB_APP_URL, {
    method: 'POST',
    // text/plain avoids the CORS preflight that Apps Script Web Apps don't handle
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Unknown error');
  return data;
}

function showToast(text, opts) {
  opts = opts || {};
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  document.getElementById('toastText').textContent = text;
  icon.className = 'ti ti-' + (opts.icon || 'check');
  toast.classList.toggle('error', !!opts.error);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), opts.duration || 1900);
}

function updateClock() {
  const now = new Date();
  document.getElementById('hours').textContent = String(now.getHours()).padStart(2, '0');
  document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('dateStr').textContent =
    dayNames[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
  renderDailyMessage();
}

function updateUndoBtn() {
  const undoBtn = document.getElementById('undoBtn');
  const canUndo = lastTap && (Date.now() - lastTap.timestamp < 30000);
  if (canUndo) {
    undoBtn.style.setProperty('--undo-color', lastTap.color);
    document.getElementById('undoTarget').textContent = lastTap.company;
    if (!undoBtn.classList.contains('show')) {
      undoBtn.classList.remove('show');
      void undoBtn.offsetWidth;
      undoBtn.classList.add('show');
    }
  } else {
    undoBtn.classList.remove('show');
  }
}

function showPlusOne(btn, color, text) {
  const kiosk = document.querySelector('.kiosk');
  const cardRect = btn.getBoundingClientRect();
  const kioskRect = kiosk.getBoundingClientRect();
  const jitter = (Math.random() - 0.5) * 28;

  const plusOne = document.createElement('div');
  plusOne.className = 'plus-one';
  plusOne.textContent = text || '+1';
  plusOne.style.color = color;
  plusOne.style.left = (cardRect.left - kioskRect.left + cardRect.width / 2 + jitter) + 'px';
  plusOne.style.top = (cardRect.top - kioskRect.top + cardRect.height / 2) + 'px';
  kiosk.appendChild(plusOne);
  setTimeout(() => plusOne.remove(), 3600);
}

// Logos live in the GitHub Pages repo, in a /logos folder, named by slug:
// "Black Salt Games" → logos/black-salt-games.png
// If a file doesn't exist, the card simply renders without a logo.
const LOGO_PATH = 'logos/';

function logoSlug(name) {
  return String(name).toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  parties.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'kiosk-card';
    btn.style.setProperty('--card-color', c.color);
    btn.setAttribute('aria-label', 'Log coffee for ' + c.name);

    const logoHtml = c.isGuest ? '' :
      '<img class="kiosk-card-logo" alt="" ' +
        'src="' + LOGO_PATH + logoSlug(c.name) + '.png" ' +
        'onerror="this.remove()">';

    btn.innerHTML =
      '<div class="kiosk-card-row">' +
        logoHtml +
        '<div class="kiosk-card-name">' +
          (c.isGuest ? '<i class="ti ti-user guest-icon"></i>' : '') +
          escapeHtml(c.name) +
        '</div>' +
      '</div>' +
      '<div class="kiosk-card-check"><i class="ti ti-check"></i></div>';
    btn.addEventListener('click', () => logCafe(c, btn));
    grid.appendChild(btn);
  });
}

// −1 when the company is consuming prepaid credit; +1 when adding to debt
function tapSign(c) {
  return (Number(c.balance) || 0) > 0 ? '−1' : '+1';
}

// Shared success feedback (animation, undo pill, toast, local balance)
function tapFeedback(c, btn, sign) {
  showPlusOne(btn, c.color, sign);
  btn.classList.add('tapped');
  setTimeout(() => btn.classList.remove('tapped'), 650);
  lastTap = { company: c.name, color: c.color, timestamp: Date.now() };
  updateUndoBtn();
}

async function logCafe(c, btn) {
  if (c.requiresPin) {
    openPinPad(c, btn);
    return;
  }

  // No PIN configured — keep the original optimistic flow
  const sign = tapSign(c);
  tapFeedback(c, btn, sign);
  c.balance = (Number(c.balance) || 0) - 1;

  try {
    await sendToBackend({ type: 'log', company: c.name });
    showToast("On " + c.name + "'s tab", { icon: 'check' });
  } catch (err) {
    // Backend rejected the tap — revert and show error
    c.balance = (Number(c.balance) || 0) + 1;
    lastTap = null;
    updateUndoBtn();
    showToast("Couldn't log — try again", { icon: 'alert-triangle', error: true, duration: 3000 });
    console.error(err);
  }
}

// ── PIN pad ─────────────────────────────────────────────────────
const pinState = { party: null, btn: null, digits: '' };
const pinOverlay = document.getElementById('pinOverlay');
const pinPanel = document.getElementById('pinPanel');
const pinDotsEl = document.getElementById('pinDots');
const pinErrorEl = document.getElementById('pinError');
const pinHintEl = document.getElementById('pinHint');

function openPinPad(c, btn) {
  pinState.party = c;
  pinState.btn = btn;
  pinState.digits = '';
  pinPanel.classList.remove('busy');
  pinPanel.style.setProperty('--pin-color', c.color);
  document.getElementById('pinCompany').textContent = c.name;
  pinHintEl.textContent = "Enter your team's 4-digit PIN";
  pinErrorEl.classList.remove('show');
  renderPinDots();
  pinOverlay.classList.add('open');
}

function closePinPad() {
  pinOverlay.classList.remove('open');
  pinState.party = null;
  pinState.btn = null;
  pinState.digits = '';
}

function renderPinDots() {
  const dots = pinDotsEl.querySelectorAll('.pin-dot');
  for (let i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('filled', i < pinState.digits.length);
  }
}

async function submitPin() {
  const c = pinState.party;
  const btn = pinState.btn;
  const pin = pinState.digits;
  if (!c) return;

  pinPanel.classList.add('busy');
  pinHintEl.textContent = 'Confirming…';

  try {
    await sendToBackend({ type: 'log', company: c.name, pin: pin });
    const sign = tapSign(c);
    closePinPad();
    tapFeedback(c, btn, sign);
    c.balance = (Number(c.balance) || 0) - 1;
    showToast("On " + c.name + "'s tab", { icon: 'check' });
  } catch (err) {
    pinPanel.classList.remove('busy');
    if (/pin/i.test(String(err.message))) {
      // Wrong PIN — shake, clear, let them retry
      pinState.digits = '';
      renderPinDots();
      pinHintEl.textContent = "Enter your team's 4-digit PIN";
      pinErrorEl.classList.add('show');
      pinDotsEl.classList.remove('shake');
      void pinDotsEl.offsetWidth;
      pinDotsEl.classList.add('shake');
    } else {
      closePinPad();
      showToast("Couldn't log — try again", { icon: 'alert-triangle', error: true, duration: 3000 });
      console.error(err);
    }
  }
}

document.querySelectorAll('.pin-key').forEach(key => {
  key.addEventListener('click', () => {
    if (!pinState.party || pinPanel.classList.contains('busy')) return;
    const k = key.dataset.key;
    pinErrorEl.classList.remove('show');
    if (k === 'clear') {
      pinState.digits = '';
    } else if (k === 'back') {
      pinState.digits = pinState.digits.slice(0, -1);
    } else if (pinState.digits.length < 4) {
      pinState.digits += k;
    }
    renderPinDots();
    if (pinState.digits.length === 4) submitPin();
  });
});
document.getElementById('pinCancel').addEventListener('click', closePinPad);
pinOverlay.addEventListener('click', e => {
  if (e.target === pinOverlay && !pinPanel.classList.contains('busy')) closePinPad();
});

async function undoLast() {
  if (!lastTap) return;
  if (Date.now() - lastTap.timestamp >= 30000) {
    lastTap = null;
    updateUndoBtn();
    return;
  }
  const company = lastTap.company;
  try {
    await sendToBackend({ type: 'undo', company: company });
    const p = parties.find(x => x.name === company);
    if (p) p.balance = (Number(p.balance) || 0) + 1;
    showToast('Undone — no charge to ' + company, { icon: 'arrow-back-up' });
    lastTap = null;
    updateUndoBtn();
  } catch (err) {
    showToast('Could not undo', { icon: 'alert-triangle', error: true, duration: 3000 });
    console.error(err);
  }
}

document.getElementById('undoBtn').addEventListener('click', undoLast);
setInterval(updateUndoBtn, 1000);
setInterval(updateClock, 30000);
setInterval(syncParties, 60000);   // pick up guests added on the dashboard

updateClock();
buildGrid();
syncParties();

if (WEB_APP_URL === 'PASTE_YOUR_WEB_APP_URL_HERE') {
  showToast('Paste your Web App URL in kiosk.html first', { icon: 'alert-triangle', error: true, duration: 8000 });
}
