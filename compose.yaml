# ─────────────────────────────────────────────────────────────
# Komodo Stack — Coffee Kiosk (frontend)
#
# No Komodo: Stacks → New Stack → modo Git Repo (recomendado),
# UI Defined ou Files on Host. Habilite "Run Build" pra que o
# Komodo rode `docker compose build` antes do `up` (precisamos
# disso porque o serviço tem `build:`).
# ─────────────────────────────────────────────────────────────
services:
  coffee-kiosk:
    container_name: coffee-kiosk
    build:
      context: .
      dockerfile: Dockerfile
    image: coffee-kiosk:latest
    restart: unless-stopped
    ports:
      # Porta no host : porta no container.
      # Ajuste KIOSK_PORT no Environment do Stack se 8080 estiver ocupada.
      - "${KIOSK_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: ${COMPOSE_LOGGING_DRIVER:-local}
